<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pointage – Événement Management &amp; RH · ISCAE Manouba</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1c1b19;--mut:#6b6860;--acc:#2b3f93;--gold:#c8a53a;--accink:#fff;--bd:#dde1f0;--ok:#1b7a4b;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1226;--card:#171c38;--ink:#f0eee8;--mut:#a09d94;--acc:#8fa6ff;--accink:#0b1240;--bd:#2a3160;--gold:#d8b84e;--ok:#5fd397;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#0e1226;--card:#171c38;--ink:#f0eee8;--mut:#a09d94;--acc:#8fa6ff;--accink:#0b1240;--bd:#2a3160;--gold:#d8b84e;--ok:#5fd397;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.35rem;margin:0 0 4px;color:var(--acc)}
.brand{background:#fff;border-radius:14px;border-bottom:4px solid var(--gold);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand img{height:60px;width:auto;max-width:46%;object-fit:contain}
.sub{color:var(--mut);margin:0 0 20px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:.9rem}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--accink);cursor:pointer}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--bd)}
button:disabled{opacity:.5}
.full{width:100%;margin-top:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1}
.ok{color:var(--ok);font-weight:600}.err{color:var(--err)}
#qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;width:max-content;margin:12px auto}
.count{font-size:2.2rem;font-weight:700;color:var(--acc)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row small{color:var(--mut);display:block}
.row button{padding:6px 10px;font-size:.8rem}
.hide{display:none}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
</style>
</head>

  <h1>Pointage des présences</h1>
  <p class="sub">Événement Management &amp; RH · ISCAE Manouba</p>
  <div id="msg" class="card">Chargement…</div>

  <div id="tabs" class="tabs hide">
    <button id="tOrg">Organisateur</button>
    <button id="tStu" class="ghost">Pointer ma présence</button>
  </div>

  <section id="stu" class="hide">
    <div class="card">
      <div id="done" class="hide"><p class="ok">✓ Votre présence est enregistrée.</p><p id="doneInfo" class="sub"></p></div>
      <div id="formBox">
        <label for="nom">Nom et prénom</label>
        <input id="nom" autocomplete="name" placeholder="Ex. Ben Salah Ahmed">
        <label for="grp">Filière / groupe</label>
        <input id="grp" placeholder="Ex. 1LSG, groupe 2">
        <button id="go" class="full">Je confirme ma présence</button>
        <p id="ferr" class="err"></p>
      </div>
    </div>
    <div class="card">
      <button id="admBtn" class="ghost full" style="margin-top:0">Accès administrateur</button>
      <div id="admBox" class="hide">
        <label for="admCode">Code d’accès</label>
        <input id="admCode" type="password" autocomplete="off">
        <button id="admGo" class="full">Valider</button>
        <p id="aerr" class="err"></p>
      </div>
    </div>
  </section>

  <section id="org" class="hide">
    <div class="card">
      <div class="bar">
        <div><div class="count" id="cnt">0</div><div class="sub" style="margin:0">présent(s)</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button id="mail">Envoyer par e-mail</button><button id="csv" class="ghost">Exporter CSV</button></div>
      </div>
      <input id="q" placeholder="Rechercher un étudiant…" style="margin-top:12px">
      <div id="list"></div>
    </div>
  </section>
</main>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var db=null,user=null,uid=null,owner=false,rows=[];
  function show(id,on){$(id).classList.toggle("hide",!on)}
  function setMsg(t,err){var m=$("#msg");m.textContent=t;m.className="card"+(err?" err":"");show("#msg",!!t)}

  function tab(o){
    show("#org",o);show("#stu",!o);
    $("#tOrg").className=o?"":"ghost";$("#tStu").className=o?"ghost":"";
  }
  function renderList(){
    var q=($("#q").value||"").toLowerCase(),l=$("#list");l.textContent="";
    $("#cnt").textContent=rows.length;
    rows.filter(function(r){return((r.nom||"")+" "+(r.grp||"")).toLowerCase().indexOf(q)>-1}).forEach(function(r){
      var d=document.createElement("div");d.className="row";
      var t=document.createElement("div"),n=document.createElement("span"),s=document.createElement("small");
      n.textContent=r.nom||"—";
      s.textContent=(r.grp||"")+" · "+new Date(r.ts||0).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
      t.appendChild(n);t.appendChild(s);
      var b=document.createElement("button");b.className="ghost";b.textContent="Retirer";
      b.onclick=function(){if(confirm("Retirer cette présence ?"))db.collection("presences").doc(r.id).delete().catch(function(){})};
      d.appendChild(t);if(owner)d.appendChild(b);l.appendChild(d);
    });
  }
  function csvCell(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'}
  async function exportCsv(){
    if(!started)return;
    try{
      var dl=await claude.use("downloads");if(!dl){alert("Export indisponible ici.");return}
      var out=["Nom;Filière/groupe;Heure"].concat(rows.map(function(r){
        return [csvCell(r.nom),csvCell(r.grp),csvCell(new Date(r.ts||0).toLocaleString("fr-FR"))].join(";")}));
      await dl.save({filename:"presences-iscae.csv",data:new Blob(["\ufeff"+out.join("\n")],{type:"text/csv"})});
    }catch(e){}
  }
  var TO="gharbimolka1107@gmail.com";
  function sendMail(){
    if(!started)return;
    var l=rows.slice().sort(function(a,b){return(a.ts||0)-(b.ts||0)}).map(function(r,i){
      return(i+1)+". "+(r.nom||"—")+" ("+(r.grp||"")+") – "+new Date(r.ts||0).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})});
    var head="Liste des présences – Événement Management & RH, ISCAE Manouba\nTotal : "+rows.length+" présent(s)\n\n";
    var note="\n\n[Liste tronquée : joindre l’export CSV pour la liste complète]";
    var body=head+l.join("\n"),cut=false;
    while(encodeURIComponent(body+(cut?note:"")).length>1800&&l.length){l.pop();cut=true;body=head+l.join("\n")}
    if(cut)body+=note;
    window.open("mailto:"+TO+"?subject="+encodeURIComponent("Présences – Événement Management & RH ISCAE Manouba")+"&body="+encodeURIComponent(body),"_blank");
  }
  function startOwner(){
    $("#mail").onclick=sendMail;$("#csv").onclick=exportCsv;$("#q").oninput=renderList;
    db.collection("presences").onSnapshot(function(s){
      rows=s.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o}).sort(function(a,b){return(b.ts||0)-(a.ts||0)});
      renderList();
    },function(){setMsg("Lecture impossible : vérifiez vos droits.",true)});
  }
  var DK="iscae_rh_pointage_v1";
  function saveDev(d){try{localStorage.setItem(DK,JSON.stringify({nom:d.nom||"",ts:d.ts||Date.now()}))}catch(e){}}
  function lock(d){
    $("#formBox").classList.add("hide");show("#done",true);
    $("#done .ok").textContent="✓ Cet appareil a déjà été utilisé pour pointer.";
    $("#doneInfo").textContent=(d.nom||"")+" · "+new Date(d.ts||0).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }
  async function startStudent(){
    var ref=db.collection("presences").doc(uid);
    var dev=null;try{dev=JSON.parse(localStorage.getItem(DK)||"null")}catch(e){}
    if(dev&&!owner){lock(dev);return}
    try{
      var s=await ref.get();
      if(s.exists){var d=s.data()||{};saveDev(d);$("#formBox").classList.add("hide");show("#done",true);
        $("#doneInfo").textContent=(d.nom||"")+" · "+new Date(d.ts||0).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
    }catch(e){}
    $("#go").onclick=async function(){
      var nom=$("#nom").value.trim(),grp=$("#grp").value.trim();
      if(nom.length<3||!grp){$("#ferr").textContent="Veuillez renseigner votre nom et votre groupe.";return}
      $("#go").disabled=true;$("#ferr").textContent="";
      try{
        await ref.set({nom:nom,grp:grp,ts:Date.now()});
        saveDev({nom:nom});
        $("#formBox").classList.add("hide");show("#done",true);
        $("#doneInfo").textContent=nom+" · "+grp;
      }catch(e){$("#go").disabled=false;$("#ferr").textContent="Échec de l’enregistrement. Réessayez."}
    };
  }
  var ADM="86a34765fe21e3a25d6f1ad93c84114d3b8ad9548eb979782fd820cf764b2522",started=false;
  async function sha(s){
    var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
  }
  function openAdmin(){
    show("#tabs",true);tab(true);
    if(!started){started=true;startOwner()}
  }
  async function init(){
    var timer=setTimeout(function(){setMsg("Connexion impossible. Ouvrez cette page depuis le lien officiel, connecté à votre compte.",true)},10000);
    try{
      if(window.claude){user=await claude.use("user");db=await claude.use("db")}
    }catch(e){}
    clearTimeout(timer);
    if(!db||!user){setMsg("Connexion requise pour pointer votre présence. Ouvrez le lien officiel et connectez-vous.",true);return}
    setMsg("");
    uid=await user.id();owner=user.isOwner();
    show("#stu",true);startStudent();
    $("#tOrg").onclick=function(){tab(true)};$("#tStu").onclick=function(){tab(false)};
    $("#admBtn").onclick=function(){show("#admBox",true);$("#admBtn").classList.add("hide")};
    $("#admGo").onclick=async function(){
      var h=await sha($("#admCode").value.trim());
      if(h===ADM){$("#aerr").textContent="";openAdmin()}else{$("#aerr").textContent="Code incorrect."}
    };
    if(owner)openAdmin();
  }
  init();
})();
</script>
</body>
</html>
